# ============================================================
# GitHub Actions CI/CD Pipeline — PayPulse Lite (Unit-IV)
# Stages: Lint → Test → Build → Docker Image → Deploy Ready
# ============================================================

name: PayPulse Lite CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  NODE_VERSION: '20'
  DOCKER_IMAGE: paypulse-backend

jobs:
  # --- Stage 1: Lint & Type Check ---
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      run: |
        cd backend
        npm ci || npm install

    - name: TypeScript Compile Check
      run: |
        cd backend
        npx tsc --noEmit

  # --- Stage 2: Unit & API Tests ---
  test:
    name: 🧪 Unit & API Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      run: |
        cd backend
        npm ci || npm install

    - name: Run Jest Test Suite
      run: |
        cd backend
        npm test
      env:
        NODE_ENV: test
        JWT_SECRET: ci_test_secret_key

  # --- Stage 3: Build TypeScript ---
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      run: |
        cd backend
        npm ci || npm install

    - name: Build TypeScript to JavaScript
      run: |
        cd backend
        npm run build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-dist
        path: backend/dist/
        retention-days: 7

  # --- Stage 4: Docker Image ---
  docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Backend Docker Image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:latest ./backend
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./backend

    - name: Verify Docker Image
      run: |
        docker images | grep ${{ env.DOCKER_IMAGE }}

    - name: Build Frontend Docker Image
      run: |
        docker build -t paypulse-frontend:latest ./frontend
