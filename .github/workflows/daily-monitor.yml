# ============================================================
# PayPulse Lite — Scheduled Daily Health Monitor
# Runs every day at 06:00 UTC and posts a project health digest
# ============================================================

name: 📡 Daily Project Health Monitor

on:
  schedule:
    # Every day at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Type of report to generate'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - tests-only
          - security-only

jobs:

  # ──────────────────────────────────────────────────────────
  # JOB 1 — CODEBASE HEALTH CHECK
  # ──────────────────────────────────────────────────────────
  health-check:
    name: 🩺 Codebase Health Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        working-directory: backend
        run: npm ci --prefer-offline

      - name: 🔷 TypeScript Check
        working-directory: backend
        run: npx tsc --noEmit

      - name: 🔐 Security Audit
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true
        id: audit

      - name: 🧪 Full Test Suite
        working-directory: backend
        id: tests
        run: |
          npm test -- --runInBand --coverage \
            --coverageReporters=text-summary \
            2>&1 | tee test-output.txt
        env:
          NODE_ENV: test
          JWT_SECRET: daily_monitor_secret_2026
          USE_POSTGRES: 'false'

      - name: 📊 Count Project Metrics
        id: metrics
        run: |
          TOTAL_FILES=$(find backend/src frontend/src -name "*.ts" -o -name "*.tsx" 2>/dev/null | wc -l)
          TEST_FILES=$(find backend/tests -name "*.test.ts" 2>/dev/null | wc -l)
          TOTAL_LINES=$(find backend/src frontend/src -name "*.ts" -o -name "*.tsx" 2>/dev/null | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')
          TESTS=$(grep -oP 'Tests:\s+\K[0-9]+(?= passed)' backend/test-output.txt || echo "N/A")
          SUITES=$(grep -oP 'Test Suites:\s+\K[0-9]+(?= passed)' backend/test-output.txt || echo "N/A")
          LAST_COMMIT=$(git log -1 --format="%h — %s (%ar)" 2>/dev/null)
          LAST_AUTHOR=$(git log -1 --format="%an" 2>/dev/null)
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          echo "test_files=$TEST_FILES" >> $GITHUB_OUTPUT
          echo "total_lines=$TOTAL_LINES" >> $GITHUB_OUTPUT
          echo "tests_passed=$TESTS" >> $GITHUB_OUTPUT
          echo "suites_passed=$SUITES" >> $GITHUB_OUTPUT
          echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
          echo "last_author=$LAST_AUTHOR" >> $GITHUB_OUTPUT

      - name: 📋 Publish Daily Health Report
        run: |
          echo "# 📡 PayPulse Lite — Daily Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Generated automatically at $(date -u +"%A, %B %d %Y — %H:%M UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📈 Project Snapshot" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------|:------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 Source Files (TS/TSX) | ${{ steps.metrics.outputs.total_files }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test Files | ${{ steps.metrics.outputs.test_files }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 Total Lines of Code | ${{ steps.metrics.outputs.total_lines }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Tests Passed | **${{ steps.metrics.outputs.tests_passed }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Suites Passed | **${{ steps.metrics.outputs.suites_passed }}** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔎 Health Checks" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|:------|:------:|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Compile | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ steps.audit.outcome == 'success' && '✅ Clean' || '⚠️ Review needed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | ${{ steps.tests.outcome == 'success' && '✅ All Passing' || '❌ Failures Detected' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🕐 Repository Activity" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:------|:------|" >> $GITHUB_STEP_SUMMARY
          echo "| Last Commit | ${{ steps.metrics.outputs.last_commit }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Last Author | ${{ steps.metrics.outputs.last_author }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🗺️ Syllabus Coverage Status" >> $GITHUB_STEP_SUMMARY
          echo "| Unit | Topic | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|:-----|:------|:------:|" >> $GITHUB_STEP_SUMMARY
          echo "| I | Clean Architecture & Jest Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| II | REST API, JWT, Rate Limiting, Zod | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| III | Polyglot DB, ACID Concurrency, React SPA | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| IV | Docker, Kubernetes, Terraform, CI/CD | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| V | Prometheus Metrics, Health Probes, Logging | ✅ |" >> $GITHUB_STEP_SUMMARY
